name: CI

on: [push, pull_request]

jobs:
  build:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Verify Installation
        run: uv run qgis-manage --version

      - name: Lint with Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run ruff check .

      - name: Format check with Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run ruff format --check .

      - name: Type check with Mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run mypy src

      - name: Framework CI (Agentic Forge)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run bash .agent/scripts/ci.sh

      - name: Agent metric consistency
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python .agent/tools/forge.py metrics validate

      - name: Self-analysis (informational)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        continue-on-error: true
        run: uv run qgis-analyzer analyze .

      - name: Test with pytest
        run: >
          uv run pytest -q
          --cov=qgis_manager --cov-report=term-missing --cov-fail-under=80
