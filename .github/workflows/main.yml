name: CI

on: [push, pull_request]

jobs:
  build:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Verify Installation
        run: uv run qgis-manage --version

      - name: Lint with Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run ruff check .

      - name: Format check with Ruff
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run ruff format --check .

      - name: Type check with Mypy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run mypy src

      - name: Install framework dev dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv pip install -r .agent/requirements-dev.txt

      - name: Framework lint and format
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv run ruff check .agent/tools .agent/tests
          uv run ruff format --check .agent/tools .agent/tests

      # v1.4.1 has one mypy false positive in forge_paths (getattr on
      # TOMLDecodeError). Remove --disable-error-code=misc once v1.4.2 lands.
      - name: Framework types
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: >
          uv run mypy --config-file .agent/mypy.ini --disable-error-code=misc
          .agent/tools .agent/tests

      - name: Framework tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run pytest .agent/tests -q

      - name: Agent system validation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          uv run python .agent/tools/forge.py validate
          uv run python .agent/tools/forge.py validate --graph
          uv run python .agent/tools/forge.py validate --conflicts
          uv run python .agent/tools/forge.py memory check

      - name: Agent metric consistency
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: uv run python .agent/tools/forge.py metrics validate

      - name: Self-analysis (informational)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        continue-on-error: true
        run: uv run qgis-analyzer analyze .

      - name: Test with pytest
        run: >
          uv run pytest -q
          --cov=qgis_manager --cov-report=term-missing --cov-fail-under=80
