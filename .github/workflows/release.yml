name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # 1. Create the draft GitHub Release when a version tag is pushed.
  draft-release:
    if: github.event_name == 'push' && startswith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve release notes
        id: release_notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          NORMALIZED="docs/releases/notes/${TAG}.md"
          LEGACY="docs/releases/notes/RELEASE_NOTES_${TAG}.md"
          if [ -f "$NORMALIZED" ]; then
            echo "path=$NORMALIZED" >> "$GITHUB_OUTPUT"
          elif [ -f "$LEGACY" ]; then
            echo "path=$LEGACY" >> "$GITHUB_OUTPUT"
          else
            FALLBACK="${RUNNER_TEMP}/release-notes-${TAG}.md"
            printf '# Release %s\n\nNo dedicated release notes were provided.\n' "$TAG" > "$FALLBACK"
            echo "path=$FALLBACK" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "Release ${{ github.ref_name }}"
          # Normalized notes first, legacy names as a fallback, then a generic body.
          body_path: ${{ steps.release_notes.outputs.path }}
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Build and publish to PyPI only once the release is published.
  #    Runs on its own condition (no needs:) so it is not skipped by the
  #    tag-only draft-release job when the event is `release`.
  publish-pypi:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distribution
        run: uv build

      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
