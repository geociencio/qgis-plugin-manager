# Agentic Forge configuration for qgis-plugin-manager.
#
# The re-usable agentic framework (skills, workflows, tooling) is versioned
# separately and mounted under [forge].framework. Project-owned state that must
# never be overwritten by a framework update lives under [forge].state.
#
# All paths are relative to the repository root.

[forge]
framework = ".agent"        # re-usable framework content (git submodule)
state = ".agent-state"      # project-owned state (memory/task/next_steps)

[project]
name = "qgis-plugin-manager"
test_dirs = ["tests"]
analyzer_command = "uv run qgis-analyzer analyze ."
max_cc = 10
module_size_limit = 400
max_lesson_lines = 350
strict_agent_system = true   # this repo opts into strict links/state/template checks

# Commands consumed by the shared workflows. Other projects may use different runners.
test_command = "uv run pytest -q"
test_command_full = "uv run pytest -q --cov=qgis_manager --cov-branch --cov-report=term-missing --cov-fail-under=90"
lint_command = "uv run ruff check ."
format_command = "uv run ruff format ."
type_command = "uv run mypy src"
version_bump_command = "uv run qgis-manage bump patch"
